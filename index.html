
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniTrack | Student Portal</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <!-- UniTrack Logo -->
            <div class="logo-container">
                <img src="images/UniTrack_Logo3.jpeg"
                     alt="UniTrack Logo"
                     class="main-logo">
            </div>

            <div class="welcome-text">WELCOME BACK</div>

            <h2>Sign In to UniTrack</h2>

            <p class="login-description">
                Access your academic journey in one place.
            </p>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Student ID -->
                <div class="mb-3">
                    <label for="studentID" class="form-label">
                        Student ID
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="studentID"
                        placeholder="Enter your student ID"
                        value="2026129795"
                        required>
                </div>

                <!-- Student Email -->
                <div class="mb-3">
                    <label for="studentEmail" class="form-label">
                        Student Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="studentEmail"
                        placeholder="Enter your student email"
                        value="2026129795@student.uitm.edu.my"
                        required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            value="Aimi@123_"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="password">
                            Show
                        </button>
                    </div>
                </div>

                <!-- Login Options -->
                <div class="login-options">

                    <label class="remember-option">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="forgot_password.html" class="forgot-link">
                        Forgot Password?
                    </a>

                </div>

                <!-- Error Message -->
                <div id="loginError" class="error-message"></div>

                <!-- Sign In Button -->
                <button type="submit" class="login-button">
                    Sign In
                </button>

            </form>

            <!-- Register Link -->
            <div class="register-text">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                © 2026 UniTrack. All rights reserved.
            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
