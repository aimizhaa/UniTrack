
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniTrack | Create Account</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container register-container">

        <div class="login-card register-card">

            <!-- UniTrack Logo -->
            <div class="logo-container">
                <img src="images/UniTrack_Logo3.jpeg"
                     alt="UniTrack Logo"
                     class="main-logo">
            </div>

            <div class="welcome-text">JOIN UNITRACK</div>

            <h2>Create Your Account</h2>

            <p class="login-description">
                Start managing your academic journey with UniTrack.
            </p>

            <!-- Registration Form -->
            <form id="registerForm">

                <!-- Full Name -->
                <div class="mb-3">
                    <label class="form-label" for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="fullName"
                        placeholder="Enter your full name"
                        value="Aimi Nazihah binti Yusri"
                        required>
                </div>

                <!-- Student ID -->
                <div class="mb-3">
                    <label class="form-label" for="registerStudentID">
                        Student ID
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="registerStudentID"
                        placeholder="Enter your student ID"
                        value="2026129795"
                        required>
                </div>

                <!-- Student Email -->
                <div class="mb-3">
                    <label class="form-label" for="email">
                        Student Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter your student email"
                        value="2026129795@student.uitm.edu.my"
                        required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label" for="registerPassword">
                        Password
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            class="form-control"
                            id="registerPassword"
                            placeholder="Create a password"
                            minlength="8"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="registerPassword">
                            Show
                        </button>
                    </div>

                    <small class="password-hint">
                        Minimum 8 characters.
                    </small>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="confirmPassword">
                            Show
                        </button>
                    </div>
                </div>

                <!-- Registration Message -->
                <div
                    id="registerMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite">
                </div>

                <!-- Create Account Button -->
                <button type="submit" class="login-button">
                    Create Account
                </button>

            </form>

            <!-- Sign In Link -->
            <div class="register-text">
                Already have an account?
                <a href="index.html">Sign In</a>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                © 2026 UniTrack. All rights reserved.
            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
