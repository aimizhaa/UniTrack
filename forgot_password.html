<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniTrack | Reset Password</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <!-- UniTrack Logo -->
            <div class="logo-container">
                <img
                    src="images/UniTrack_Logo3.jpeg"
                    alt="UniTrack Logo"
                    class="main-logo">
            </div>

            <div class="welcome-text">ACCOUNT RECOVERY</div>

            <h2>Reset Password</h2>

            <p class="login-description">
                Create a new password to regain access to your account.
            </p>

            <!-- Reset Password Form -->
            <form id="resetPasswordForm">

                <!-- Student ID -->
                <div class="mb-3">
                    <label for="resetStudentID" class="form-label">
                        Student ID
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="resetStudentID"
                        value="2026129795"
                        placeholder="Enter your student ID"
                        required>
                </div>

                <!-- Student Email -->
                <div class="mb-3">
                    <label for="resetEmail" class="form-label">
                        Student Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="resetEmail"
                        value="2026129795@student.uitm.edu.my"
                        placeholder="Enter your student email"
                        required>
                </div>

                <!-- New Password -->
                <div class="mb-3">
                    <label class="form-label" for="newPassword">
                        New Password
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            class="form-control"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="8"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="newPassword">
                            Show
                        </button>
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div class="mb-3">
                    <label class="form-label" for="confirmNewPassword">
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            class="form-control"
                            id="confirmNewPassword"
                            placeholder="Confirm new password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="confirmNewPassword">
                            Show
                        </button>
                    </div>
                </div>

                <!-- Reset Message -->
                <div
                    id="resetMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite">
                </div>

                <!-- Reset Button -->
                <button type="submit" class="login-button">
                    Reset Password
                </button>

            </form>

            <!-- Back to Login -->
            <div class="register-text">
                Remember your password?
                <a href="index.html">Back to Sign In</a>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                © 2026 UniTrack. All rights reserved.
            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
